<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
  </defs>
  <style>
    text { font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', 'WenQuanYi Micro Hei', sans-serif; }
  </style>
  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- Title -->
  <text x="400" y="40" fill="white" font-size="18" font-weight="700" text-anchor="middle">FastAPI CPU 密集型接口吞吐量实测</text>
  <text x="400" y="62" fill="#94a3b8" font-size="11" text-anchor="middle">wrk 压测 | 4 线程并发 | 30 秒 | uvicorn --workers 4</text>

  <!-- Y-axis -->
  <line x1="100" y1="100" x2="100" y2="400" stroke="#334155" stroke-width="1"/>
  <!-- Y-axis labels -->
  <text x="90" y="105" fill="#64748b" font-size="10" text-anchor="end">3000</text>
  <text x="90" y="165" fill="#64748b" font-size="10" text-anchor="end">2400</text>
  <text x="90" y="225" fill="#64748b" font-size="10" text-anchor="end">1800</text>
  <text x="90" y="285" fill="#64748b" font-size="10" text-anchor="end">1200</text>
  <text x="90" y="345" fill="#64748b" font-size="10" text-anchor="end">600</text>
  <text x="90" y="405" fill="#64748b" font-size="10" text-anchor="end">0</text>

  <!-- Horizontal grid lines -->
  <line x1="100" y1="100" x2="700" y2="100" stroke="#1e293b" stroke-width="0.5"/>
  <line x1="100" y1="160" x2="700" y2="160" stroke="#1e293b" stroke-width="0.5"/>
  <line x1="100" y1="220" x2="700" y2="220" stroke="#1e293b" stroke-width="0.5"/>
  <line x1="100" y1="280" x2="700" y2="280" stroke="#1e293b" stroke-width="0.5"/>
  <line x1="100" y1="340" x2="700" y2="340" stroke="#1e293b" stroke-width="0.5"/>
  <line x1="100" y1="400" x2="700" y2="400" stroke="#334155" stroke-width="1"/>

  <!-- Bar 1: GIL -->
  <rect x="160" y="368" width="120" height="32" rx="4" fill="#0f172a"/>
  <rect x="160" y="368" width="120" height="32" rx="4" fill="rgba(251,113,133,0.6)" stroke="#fb7185" stroke-width="1.5"/>
  <text x="220" y="390" fill="white" font-size="13" font-weight="600" text-anchor="middle">320</text>
  <text x="220" y="425" fill="#fb7185" font-size="12" font-weight="600" text-anchor="middle">GIL 模式</text>
  <text x="220" y="442" fill="#94a3b8" font-size="10" text-anchor="middle">Python 3.14</text>

  <!-- Bar 2: no-GIL -->
  <rect x="420" y="114" width="120" height="286" rx="4" fill="#0f172a"/>
  <rect x="420" y="114" width="120" height="286" rx="4" fill="rgba(52,211,153,0.6)" stroke="#34d399" stroke-width="1.5"/>
  <text x="480" y="135" fill="white" font-size="14" font-weight="700" text-anchor="middle">2,580</text>
  <text x="480" y="425" fill="#34d399" font-size="12" font-weight="600" text-anchor="middle">no-GIL 模式</text>
  <text x="480" y="442" fill="#94a3b8" font-size="10" text-anchor="middle">Python 3.14t</text>

  <!-- 8x arrow -->
  <line x1="310" y1="200" x2="390" y2="130" stroke="#fbbf24" stroke-width="2" stroke-dasharray="6,3"/>
  <polygon points="385,125 395,135 385,140" fill="#fbbf24"/>
  <rect x="320" y="150" width="80" height="30" rx="15" fill="rgba(251,191,36,0.2)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="360" y="170" fill="#fbbf24" font-size="14" font-weight="700" text-anchor="middle">8x</text>

  <!-- Y-axis label -->
  <text x="30" y="250" fill="#64748b" font-size="11" text-anchor="middle" transform="rotate(-90 30 250)">吞吐量 (req/s)</text>

  <!-- Legend -->
  <rect x="550" y="120" width="140" height="70" rx="6" fill="rgba(15,23,42,0.9)" stroke="#334155" stroke-width="1"/>
  <rect x="565" y="135" width="16" height="12" rx="2" fill="rgba(251,113,133,0.6)" stroke="#fb7185" stroke-width="1"/>
  <text x="590" y="145" fill="#94a3b8" font-size="10" text-anchor="start">GIL (单核串行)</text>
  <rect x="565" y="158" width="16" height="12" rx="2" fill="rgba(52,211,153,0.6)" stroke="#34d399" stroke-width="1"/>
  <text x="590" y="168" fill="#94a3b8" font-size="10" text-anchor="start">no-GIL (多核并行)</text>

  <!-- Bottom stats -->
  <text x="400" y="480" fill="#94a3b8" font-size="10" text-anchor="middle">平均延迟: 312ms → 38ms | CPU: 单核满载 → 4核并行</text>
</svg>
