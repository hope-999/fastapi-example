<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
  </defs>
  <style>
    text { font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', 'WenQuanYi Micro Hei', sans-serif; }
  </style>
  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- Title -->
  <text x="500" y="38" fill="white" font-size="18" font-weight="700" text-anchor="middle">Python no-GIL 演进路线图</text>

  <!-- Timeline axis -->
  <line x1="100" y1="200" x2="900" y2="200" stroke="#334155" stroke-width="2"/>

  <!-- Phase labels -->
  <text x="130" y="245" fill="#64748b" font-size="10" font-weight="600" text-anchor="middle">Phase 0</text>
  <text x="310" y="245" fill="#64748b" font-size="10" font-weight="600" text-anchor="middle">Phase 1</text>
  <text x="500" y="245" fill="#fbbf24" font-size="10" font-weight="600" text-anchor="middle">Phase 2 (当前)</text>
  <text x="690" y="245" fill="#64748b" font-size="10" font-weight="600" text-anchor="middle">Phase 3</text>
  <text x="870" y="245" fill="#64748b" font-size="10" font-weight="600" text-anchor="middle">Phase 4</text>

  <!-- Event 1: 2021 Fork -->
  <circle cx="130" cy="200" r="8" fill="#0f172a" stroke="#64748b" stroke-width="2"/>
  <text x="130" y="170" fill="#94a3b8" font-size="10" font-weight="600" text-anchor="middle">2021</text>
  <rect x="70" y="100" width="120" height="50" rx="6" fill="#0f172a"/>
  <rect x="70" y="100" width="120" height="50" rx="6" fill="rgba(30,41,59,0.5)" stroke="#64748b" stroke-width="1.5"/>
  <text x="130" y="120" fill="white" font-size="10" font-weight="600" text-anchor="middle">Sam Gross</text>
  <text x="130" y="135" fill="#94a3b8" font-size="9" text-anchor="middle">nogil fork</text>
  <text x="130" y="148" fill="#64748b" font-size="8" text-anchor="middle">Meta 工程师</text>

  <!-- Event 2: 2023 PEP 703 -->
  <circle cx="310" cy="200" r="8" fill="#0f172a" stroke="#64748b" stroke-width="2"/>
  <text x="310" y="170" fill="#94a3b8" font-size="10" font-weight="600" text-anchor="middle">2023</text>
  <rect x="250" y="100" width="120" height="50" rx="6" fill="#0f172a"/>
  <rect x="250" y="100" width="120" height="50" rx="6" fill="rgba(30,41,59,0.5)" stroke="#64748b" stroke-width="1.5"/>
  <text x="310" y="120" fill="white" font-size="10" font-weight="600" text-anchor="middle">PEP 703</text>
  <text x="310" y="135" fill="#94a3b8" font-size="9" text-anchor="middle">Steering Council</text>
  <text x="310" y="148" fill="#64748b" font-size="8" text-anchor="middle">正式接受</text>

  <!-- Event 3: 2024 3.13 实验 -->
  <circle cx="410" cy="200" r="6" fill="#0f172a" stroke="#22d3ee" stroke-width="2"/>
  <text x="410" y="275" fill="#22d3ee" font-size="9" text-anchor="middle">2024.10</text>
  <rect x="350" y="280" width="120" height="45" rx="6" fill="#0f172a"/>
  <rect x="350" y="280" width="120" height="45" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="410" y="298" fill="white" font-size="10" font-weight="600" text-anchor="middle">Python 3.13</text>
  <text x="410" y="313" fill="#94a3b8" font-size="9" text-anchor="middle">实验性 free-threading</text>

  <!-- Event 4: 2025 3.14 官方 -->
  <circle cx="500" cy="200" r="10" fill="#0f172a" stroke="#fbbf24" stroke-width="3"/>
  <text x="500" y="170" fill="#fbbf24" font-size="11" font-weight="700" text-anchor="middle">2025.10</text>
  <rect x="430" y="80" width="140" height="65" rx="6" fill="#0f172a"/>
  <rect x="430" y="80" width="140" height="65" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="2"/>
  <text x="500" y="102" fill="#fbbf24" font-size="12" font-weight="700" text-anchor="middle">Python 3.14</text>
  <text x="500" y="118" fill="white" font-size="10" font-weight="600" text-anchor="middle">PEP 779 官方支持</text>
  <text x="500" y="133" fill="#94a3b8" font-size="9" text-anchor="middle">python3.14t</text>

  <!-- Current marker arrow -->
  <polygon points="490,55 500,70 510,55" fill="#fbbf24"/>
  <text x="500" y="48" fill="#fbbf24" font-size="10" font-weight="700" text-anchor="middle">当前位置</text>

  <!-- Event 5: 2027-28 Phase 3 -->
  <circle cx="690" cy="200" r="8" fill="#0f172a" stroke="#64748b" stroke-width="2"/>
  <text x="690" y="275" fill="#64748b" font-size="9" text-anchor="middle">2027-28</text>
  <rect x="630" y="280" width="120" height="45" rx="6" fill="#0f172a"/>
  <rect x="630" y="280" width="120" height="45" rx="6" fill="rgba(30,41,59,0.5)" stroke="#64748b" stroke-width="1.5"/>
  <text x="690" y="298" fill="white" font-size="10" font-weight="600" text-anchor="middle">Phase 3</text>
  <text x="690" y="313" fill="#94a3b8" font-size="9" text-anchor="middle">默认关闭 GIL</text>

  <!-- Event 6: 2029-30 Phase 4 -->
  <circle cx="870" cy="200" r="8" fill="#0f172a" stroke="#64748b" stroke-width="2"/>
  <text x="870" y="275" fill="#64748b" font-size="9" text-anchor="middle">2029-30</text>
  <rect x="810" y="280" width="120" height="45" rx="6" fill="#0f172a"/>
  <rect x="810" y="280" width="120" height="45" rx="6" fill="rgba(30,41,59,0.5)" stroke="#64748b" stroke-width="1.5"/>
  <text x="870" y="298" fill="white" font-size="10" font-weight="600" text-anchor="middle">Phase 4</text>
  <text x="870" y="313" fill="#94a3b8" font-size="9" text-anchor="middle">GIL 彻底移除</text>

  <!-- Bottom note -->
  <text x="500" y="380" fill="#64748b" font-size="10" text-anchor="middle">单线程开销: 40% → 5-10% | 生态兼容: 实验 → 51% → 目标 100%</text>
  <text x="500" y="400" fill="#64748b" font-size="10" text-anchor="middle">Source: PEP 779, PEP 703, Python Release Notes</text>
</svg>
