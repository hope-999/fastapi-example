<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
  </defs>
  <style>
    text { font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', 'WenQuanYi Micro Hei', sans-serif; }
  </style>
  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- Title -->
  <text x="450" y="36" fill="white" font-size="18" font-weight="700" text-anchor="middle">GIL vs no-GIL 多核执行对比</text>

  <!-- Left Panel: GIL Mode -->
  <rect x="40" y="60" width="380" height="400" rx="12" fill="none" stroke="#fb7185" stroke-width="1.5" stroke-dasharray="8,4"/>
  <text x="230" y="86" fill="#fb7185" font-size="14" font-weight="700" text-anchor="middle">GIL 模式（Python 3.14）</text>

  <!-- CPU Cores in GIL mode -->
  <rect x="70" y="110" width="320" height="60" rx="6" fill="#0f172a"/>
  <rect x="70" y="110" width="320" height="60" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="230" y="135" fill="white" font-size="13" font-weight="600" text-anchor="middle">线程 A - 正在执行</text>
  <text x="230" y="155" fill="#22d3ee" font-size="11" text-anchor="middle">持有 GIL</text>

  <rect x="70" y="190" width="320" height="60" rx="6" fill="#0f172a"/>
  <rect x="70" y="190" width="320" height="60" rx="6" fill="rgba(30,41,59,0.5)" stroke="#64748b" stroke-width="1.5"/>
  <text x="230" y="215" fill="#94a3b8" font-size="13" font-weight="600" text-anchor="middle">线程 B - 等待中</text>
  <text x="230" y="235" fill="#64748b" font-size="11" text-anchor="middle">等待 GIL 释放</text>

  <rect x="70" y="270" width="320" height="60" rx="6" fill="#0f172a"/>
  <rect x="70" y="270" width="320" height="60" rx="6" fill="rgba(30,41,59,0.5)" stroke="#64748b" stroke-width="1.5"/>
  <text x="230" y="295" fill="#94a3b8" font-size="13" font-weight="600" text-anchor="middle">线程 C - 等待中</text>
  <text x="230" y="315" fill="#64748b" font-size="11" text-anchor="middle">等待 GIL 释放</text>

  <rect x="70" y="350" width="320" height="60" rx="6" fill="#0f172a"/>
  <rect x="70" y="350" width="320" height="60" rx="6" fill="rgba(30,41,59,0.5)" stroke="#64748b" stroke-width="1.5"/>
  <text x="230" y="375" fill="#94a3b8" font-size="13" font-weight="600" text-anchor="middle">线程 D - 等待中</text>
  <text x="230" y="395" fill="#64748b" font-size="11" text-anchor="middle">等待 GIL 释放</text>

  <!-- CPU Utilization label -->
  <text x="230" y="442" fill="#fb7185" font-size="12" font-weight="600" text-anchor="middle">CPU 利用率: ~25% (单核满载)</text>

  <!-- Center Arrow -->
  <polygon points="440,240 460,250 440,260" fill="#22d3ee"/>
  <line x1="430" y1="250" x2="440" y2="250" stroke="#22d3ee" stroke-width="2"/>
  <text x="450" y="235" fill="#22d3ee" font-size="11" font-weight="600" text-anchor="middle">8x</text>
  <text x="450" y="280" fill="#94a3b8" font-size="10" text-anchor="middle">提升</text>

  <!-- Right Panel: no-GIL Mode -->
  <rect x="480" y="60" width="380" height="400" rx="12" fill="none" stroke="#34d399" stroke-width="1.5" stroke-dasharray="8,4"/>
  <text x="670" y="86" fill="#34d399" font-size="14" font-weight="700" text-anchor="middle">no-GIL 模式（Python 3.14t）</text>

  <!-- CPU Cores in no-GIL mode -->
  <rect x="510" y="110" width="320" height="60" rx="6" fill="#0f172a"/>
  <rect x="510" y="110" width="320" height="60" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="670" y="135" fill="white" font-size="13" font-weight="600" text-anchor="middle">线程 A - 正在执行</text>
  <text x="670" y="155" fill="#34d399" font-size="11" text-anchor="middle">无 GIL</text>

  <rect x="510" y="190" width="320" height="60" rx="6" fill="#0f172a"/>
  <rect x="510" y="190" width="320" height="60" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="670" y="215" fill="white" font-size="13" font-weight="600" text-anchor="middle">线程 B - 正在执行</text>
  <text x="670" y="235" fill="#34d399" font-size="11" text-anchor="middle">无 GIL</text>

  <rect x="510" y="270" width="320" height="60" rx="6" fill="#0f172a"/>
  <rect x="510" y="270" width="320" height="60" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="670" y="295" fill="white" font-size="13" font-weight="600" text-anchor="middle">线程 C - 正在执行</text>
  <text x="670" y="315" fill="#34d399" font-size="11" text-anchor="middle">无 GIL</text>

  <rect x="510" y="350" width="320" height="60" rx="6" fill="#0f172a"/>
  <rect x="510" y="350" width="320" height="60" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="670" y="375" fill="white" font-size="13" font-weight="600" text-anchor="middle">线程 D - 正在执行</text>
  <text x="670" y="395" fill="#34d399" font-size="11" text-anchor="middle">无 GIL</text>

  <!-- CPU Utilization label -->
  <text x="670" y="442" fill="#34d399" font-size="12" font-weight="600" text-anchor="middle">CPU 利用率: ~100% (4核并行)</text>

  <!-- Bottom note -->
  <text x="450" y="490" fill="#94a3b8" font-size="10" text-anchor="middle">4 核 CPU | 4 线程并发 | CPU 密集型计算场景</text>
</svg>
