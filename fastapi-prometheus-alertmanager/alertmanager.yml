global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'severity']
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 4h
  receiver: 'wechat-webhook'

  routes:
    - match:
        severity: critical
      receiver: 'wechat-webhook'
      continue: false

    - match:
        severity: warning
      receiver: 'email-notify'

receivers:
  - name: 'wechat-webhook'
    webhook_configs:
      - url: 'http://wechat-receiver:8000/webhook'
        send_resolved: true

  - name: 'email-notify'
    email_configs:
      - to: 'ops@yourcompany.com'
        from: 'alert@yourcompany.com'
        smarthost: 'smtp.yourcompany.com:587'
        auth_username: 'alert@yourcompany.com'
        auth_password: 'YOUR_PASSWORD'
        send_resolved: true

inhibit_rules:
  - source_match:
      alertname: 'DiskFull'
    target_match:
      severity: 'warning'
    equal: ['instance']
