<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>实时任务进度演示</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0a;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 90%;
            max-width: 500px;
            padding: 40px;
            background: #1a1a1a;
            border-radius: 16px;
            border: 1px solid #333;
        }
        h1 { font-size: 24px; margin-bottom: 8px; }
        .subtitle { color: #888; margin-bottom: 32px; }
        .btn {
            width: 100%;
            padding: 14px;
            background: #00d4ff;
            color: #000;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn:hover { background: #00b8e0; }
        .btn:disabled { background: #333; color: #666; cursor: not-allowed; }
        .progress-container {
            margin-top: 24px;
            display: none;
        }
        .progress-container.active { display: block; }
        .progress-bar {
            width: 100%;
            height: 8px;
            background: #333;
            border-radius: 4px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #00d4ff, #0099cc);
            border-radius: 4px;
            transition: width 0.3s ease;
            width: 0%;
        }
        .progress-info {
            display: flex;
            justify-content: space-between;
            margin-top: 12px;
            font-size: 14px;
        }
        .status { color: #aaa; }
        .percent { color: #00d4ff; font-weight: 600; }
        .log {
            margin-top: 20px;
            padding: 16px;
            background: #0a0a0a;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            color: #888;
            max-height: 200px;
            overflow-y: auto;
        }
        .log-entry { margin-bottom: 4px; }
        .log-entry.success { color: #4ade80; }
        .log-entry.error { color: #f87171; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 实时任务进度</h1>
        <p class="subtitle">WebSocket + Celery 演示</p>
        <button class="btn" id="startBtn" onclick="startTask()">开始处理任务</button>
        <div class="progress-container" id="progressContainer">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="progress-info">
                <span class="status" id="statusText">准备中...</span>
                <span class="percent" id="percentText">0%</span>
            </div>
        </div>
        <div class="log" id="log"></div>
    </div>
    <script>
        const startBtn = document.getElementById('startBtn');
        const progressContainer = document.getElementById('progressContainer');
        const progressFill = document.getElementById('progressFill');
        const statusText = document.getElementById('statusText');
        const percentText = document.getElementById('percentText');
        const log = document.getElementById('log');
        function addLog(message, type = '') {
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            log.appendChild(entry);
            log.scrollTop = log.scrollHeight;
        }
        async function startTask() {
            startBtn.disabled = true;
            startBtn.textContent = '任务运行中...';
            progressContainer.classList.add('active');
            log.innerHTML = '';
            try {
                addLog('正在创建任务...');
                const response = await fetch('/api/tasks', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: 'data=年度报表数据'
                });
                const { task_id } = await response.json();
                addLog(`任务创建成功：${task_id}`);
                const ws = new WebSocket(`ws://localhost:8000/ws/${task_id}`);
                ws.onopen = () => addLog('WebSocket 连接成功', 'success');
                ws.onmessage = (event) => {
                    const data = JSON.parse(event.data);
                    const { percent, status } = data;
                    progressFill.style.width = `${percent}%`;
                    statusText.textContent = status;
                    percentText.textContent = `${percent}%`;
                    addLog(`进度更新：${percent}% - ${status}`);
                    if (percent === 100) {
                        addLog('✅ 任务完成！', 'success');
                        startBtn.disabled = false;
                        startBtn.textContent = '开始处理任务';
                        ws.close();
                    }
                };
                ws.onerror = () => addLog('WebSocket 错误', 'error');
                ws.onclose = () => addLog('WebSocket 连接已关闭');
            } catch (error) {
                addLog(`错误：${error.message}`, 'error');
                startBtn.disabled = false;
                startBtn.textContent = '开始处理任务';
            }
        }
    </script>
</body>
</html>
