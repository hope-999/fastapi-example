<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 480" style="background:#0f172a">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#22d3ee"/>
    </marker>
    <marker id="arrow-emerald" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#34d399"/>
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#fbbf24"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
    text { font-family: 'JetBrains Mono','Noto Sans SC','PingFang SC',sans-serif; }
  </style>

  <!-- 标题 -->
  <text x="410" y="35" fill="white" font-size="16" font-weight="700" text-anchor="middle">类级别依赖：ConnectionPool 状态保持</text>

  <!-- 类定义框 -->
  <rect x="40" y="60" width="320" height="180" rx="8" fill="#0f172a"/>
  <rect x="40" y="60" width="320" height="180" rx="8" fill="rgba(8,51,68,0.3)" stroke="#22d3ee" stroke-width="2"/>
  <text x="60" y="85" fill="#22d3ee" font-size="12" font-weight="700">class ConnectionPool:</text>
  <text x="60" y="105" fill="#94a3b8" font-size="9" font-family="monospace">  def __init__(self, max_size: int = 10):</text>
  <text x="60" y="120" fill="#94a3b8" font-size="9" font-family="monospace">    self.pool = []          # ← 状态保持</text>
  <text x="60" y="135" fill="#94a3b8" font-size="9" font-family="monospace">    self.max_size = max_size</text>
  <text x="60" y="155" fill="#94a3b8" font-size="9" font-family="monospace">  def __call__(self):       # ← 依赖工厂入口</text>
  <text x="60" y="170" fill="#94a3b8" font-size="9" font-family="monospace">    if not self.pool:</text>
  <text x="60" y="185" fill="#94a3b8" font-size="9" font-family="monospace">      self.pool.append(create_conn())</text>
  <text x="60" y="200" fill="#94a3b8" font-size="9" font-family="monospace">    return self.pool.pop()   # ← 复用/创建</text>
  <text x="60" y="220" fill="#fbbf24" font-size="9" font-family="monospace">  # FastAPI: Depends(pool) → __call__()</text>

  <!-- 状态保持高亮 -->
  <rect x="55" y="108" width="180" height="14" rx="2" fill="rgba(251,146,60,0.2)" stroke="none"/>
  <rect x="55" y="193" width="190" height="14" rx="2" fill="rgba(251,146,60,0.2)" stroke="none"/>
  <rect x="55" y="216" width="260" height="14" rx="2" fill="rgba(120,53,15,0.3)" stroke="none"/>

  <!-- 连接池状态区 -->
  <rect x="390" y="60" width="390" height="180" rx="8" fill="#0f172a"/>
  <rect x="390" y="60" width="390" height="180" rx="8" fill="rgba(76,29,149,0.2)" stroke="#a78bfa" stroke-width="1" stroke-dasharray="6,3"/>
  <text x="410" y="85" fill="#a78bfa" font-size="11" font-weight="600">连接池状态（内存中保持）</text>

  <!-- 连接池盒子 -->
  <rect x="410" y="100" width="170" height="120" rx="6" fill="#0f172a"/>
  <rect x="410" y="100" width="170" height="120" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="495" y="125" fill="white" font-size="10" font-weight="600" text-anchor="middle">self.pool = []</text>
  <text x="495" y="145" fill="#a78bfa" font-size="9" text-anchor="middle">连接池（List[Conn]）</text>

  <!-- 连接1 -->
  <rect x="420" y="160" width="70" height="28" rx="4" fill="#0f172a"/>
  <rect x="420" y="160" width="70" height="28" rx="4" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1"/>
  <text x="455" y="178" fill="white" font-size="8" text-anchor="middle">Conn #1</text>

  <!-- 连接2 -->
  <rect x="500" y="160" width="70" height="28" rx="4" fill="#0f172a"/>
  <rect x="500" y="160" width="70" height="28" rx="4" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1"/>
  <text x="535" y="178" fill="white" font-size="8" text-anchor="middle">Conn #2</text>

  <!-- 连接3（虚线表示可扩展） -->
  <rect x="420" y="195" width="150" height="14" rx="2" fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="495" y="205" fill="#64748b" font-size="7" text-anchor="middle">... max_size 限制</text>

  <!-- 生命周期说明 -->
  <rect x="600" y="100" width="160" height="120" rx="6" fill="#0f172a"/>
  <rect x="600" y="100" width="160" height="120" rx="6" fill="rgba(59,130,246,0.1)" stroke="#60a5fa" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="610" y="120" fill="#60a5fa" font-size="9" font-weight="600">生命周期</text>
  <text x="610" y="140" fill="white" font-size="8">• 应用启动：pool = []</text>
  <text x="610" y="155" fill="white" font-size="8">• 首次请求：创建连接</text>
  <text x="610" y="170" fill="white" font-size="8">• 后续请求：复用连接</text>
  <text x="610" y="185" fill="white" font-size="8">• 应用关闭：清理连接</text>
  <text x="610" y="205" fill="#60a5fa" font-size="8">单例保持状态</text>

  <!-- 箭头: 类 → 连接池 -->
  <line x1="360" y1="120" x2="405" y2="145" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>
  <text x="375" y="140" fill="#22d3ee" font-size="8">初始化</text>

  <!-- 箭头: 连接池 → 生命周期 -->
  <line x1="580" y1="160" x2="595" y2="160" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrow-emerald)"/>

  <!-- FastAPI 使用方式 -->
  <rect x="40" y="270" width="740" height="110" rx="8" fill="#0f172a"/>
  <rect x="40" y="270" width="740" height="110" rx="8" fill="rgba(120,53,15,0.1)" stroke="#fbbf24" stroke-width="1" stroke-dasharray="6,3"/>
  <text x="55" y="295" fill="#fbbf24" font-size="11" font-weight="600">FastAPI 使用方式：Depends(pool)</text>

  <!-- 步骤1 -->
  <rect x="55" y="310" width="200" height="55" rx="6" fill="#0f172a"/>
  <rect x="55" y="310" width="200" height="55" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="155" y="333" fill="white" font-size="10" font-weight="600" text-anchor="middle">路由声明</text>
  <text x="155" y="350" fill="#22d3ee" font-size="8" text-anchor="middle" font-family="monospace">@app.get("/items")</text>
  <text x="155" y="362" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="monospace">async def get_items(conn = Depends(pool)):</text>

  <!-- 箭头 -->
  <line x1="255" y1="337" x2="310" y2="337" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>
  <text x="282" y="330" fill="#22d3ee" font-size="8" text-anchor="middle">触发</text>

  <!-- 步骤2 -->
  <rect x="310" y="310" width="200" height="55" rx="6" fill="#0f172a"/>
  <rect x="310" y="310" width="200" height="55" rx="6" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="1.5"/>
  <text x="410" y="333" fill="white" font-size="10" font-weight="600" text-anchor="middle">FastAPI 解析依赖</text>
  <text x="410" y="350" fill="#fb7185" font-size="8" text-anchor="middle">检测到 pool 是可调用对象</text>
  <text x="410" y="362" fill="#94a3b8" font-size="8" text-anchor="middle">调用 pool.__call__() 获取连接</text>

  <!-- 箭头 -->
  <line x1="510" y1="337" x2="565" y2="337" stroke="#fb7185" stroke-width="1.5" marker-end="url(#arrow-rose)"/>
  <text x="537" y="330" fill="#fb7185" font-size="8" text-anchor="middle">返回</text>

  <!-- 步骤3 -->
  <rect x="565" y="310" width="200" height="55" rx="6" fill="#0f172a"/>
  <rect x="565" y="310" width="200" height="55" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="665" y="333" fill="white" font-size="10" font-weight="600" text-anchor="middle">路由执行</text>
  <text x="665" y="350" fill="#34d399" font-size="8" text-anchor="middle">拿到 conn 对象</text>
  <text x="665" y="362" fill="#94a3b8" font-size="8" text-anchor="middle">执行业务逻辑，返回响应</text>

  <!-- 对比说明 -->
  <rect x="40" y="400" width="740" height="60" rx="8" fill="#0f172a"/>
  <rect x="40" y="400" width="740" height="60" rx="8" fill="rgba(59,130,246,0.08)" stroke="#60a5fa" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="55" y="420" fill="#60a5fa" font-size="10" font-weight="600">与传统函数依赖的区别</text>
  <text x="55" y="440" fill="white" font-size="9">传统函数依赖：每次调用都是新实例，无状态 | 类级别依赖：实例在内存中保持状态，连接池、计数器、限流器都靠它</text>
  <text x="55" y="455" fill="#94a3b8" font-size="9">关键：__call__ 让 FastAPI 把对象本身当成依赖工厂，状态保持、参数预置、生命周期管理都在一个类里解决</text>

  <!-- 底部提示 -->
  <text x="410" y="475" fill="#64748b" font-size="9" text-anchor="middle">类级别依赖 = 状态保持 + 工厂模式 + 依赖注入，三合一</text>
</svg>