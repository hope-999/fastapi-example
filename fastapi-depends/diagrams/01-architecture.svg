<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" style="background:#0f172a">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#22d3ee"/>
    </marker>
    <marker id="arrow-emerald" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#34d399"/>
    </marker>
    <marker id="arrow-violet" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#a78bfa"/>
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#fbbf24"/>
    </marker>
    <marker id="arrow-rose" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#fb7185"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
    text { font-family: 'JetBrains Mono','Noto Sans SC','PingFang SC',sans-serif; }
  </style>

  <!-- 标题 -->
  <text x="450" y="40" fill="white" font-size="16" font-weight="700" text-anchor="middle">FastAPI 依赖注入 5 大高阶用法</text>

  <!-- 路由层区域 -->
  <rect x="30" y="70" width="840" height="100" rx="12" fill="none" stroke="#22d3ee" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="50" y="95" fill="#22d3ee" font-size="10" font-weight="600">路由层 (Router Layer)</text>

  <!-- 路由盒子 -->
  <rect x="360" y="110" width="180" height="45" rx="6" fill="#0f172a"/>
  <rect x="360" y="110" width="180" height="45" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="450" y="132" fill="white" font-size="11" font-weight="600" text-anchor="middle">@app.get("/admin-only")</text>
  <text x="450" y="148" fill="#94a3b8" font-size="9" text-anchor="middle">路由声明: Depends(require_admin)</text>

  <!-- 依赖层区域 -->
  <rect x="30" y="190" width="840" height="200" rx="12" fill="none" stroke="#34d399" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="50" y="215" fill="#34d399" font-size="10" font-weight="600">依赖层 (Dependency Layer)</text>

  <!-- 5个用法盒子 -->
  <!-- use_cache -->
  <rect x="60" y="235" width="140" height="60" rx="6" fill="#0f172a"/>
  <rect x="60" y="235" width="140" height="60" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="130" y="258" fill="white" font-size="10" font-weight="600" text-anchor="middle">use_cache=False</text>
  <text x="130" y="274" fill="#94a3b8" font-size="8" text-anchor="middle">禁用缓存控制</text>
  <text x="130" y="286" fill="#94a3b8" font-size="8" text-anchor="middle">时间戳/UUID</text>

  <!-- 嵌套依赖 -->
  <rect x="230" y="235" width="140" height="60" rx="6" fill="#0f172a"/>
  <rect x="230" y="235" width="140" height="60" rx="6" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="1.5"/>
  <text x="300" y="258" fill="white" font-size="10" font-weight="600" text-anchor="middle">嵌套依赖</text>
  <text x="300" y="274" fill="#94a3b8" font-size="8" text-anchor="middle">get_current_user</text>
  <text x="300" y="286" fill="#94a3b8" font-size="8" text-anchor="middle">→ require_admin</text>

  <!-- 依赖工厂 -->
  <rect x="400" y="235" width="140" height="60" rx="6" fill="#0f172a"/>
  <rect x="400" y="235" width="140" height="60" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="470" y="258" fill="white" font-size="10" font-weight="600" text-anchor="middle">依赖工厂</text>
  <text x="470" y="274" fill="#94a3b8" font-size="8" text-anchor="middle">check_permissions()</text>
  <text x="470" y="286" fill="#94a3b8" font-size="8" text-anchor="middle">functools.partial</text>

  <!-- 类级别依赖 -->
  <rect x="570" y="235" width="140" height="60" rx="6" fill="#0f172a"/>
  <rect x="570" y="235" width="140" height="60" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="640" y="258" fill="white" font-size="10" font-weight="600" text-anchor="middle">类级别依赖</text>
  <text x="640" y="274" fill="#94a3b8" font-size="8" text-anchor="middle">ConnectionPool</text>
  <text x="640" y="286" fill="#94a3b8" font-size="8" text-anchor="middle">__call__() 状态保持</text>

  <!-- 条件跳过 -->
  <rect x="740" y="235" width="110" height="60" rx="6" fill="#0f172a"/>
  <rect x="740" y="235" width="110" height="60" rx="6" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="795" y="258" fill="white" font-size="10" font-weight="600" text-anchor="middle">条件跳过</text>
  <text x="795" y="274" fill="#94a3b8" font-size="8" text-anchor="middle">Optional</text>
  <text x="795" y="286" fill="#94a3b8" font-size="8" text-anchor="middle">可选鉴权</text>

  <!-- 调用链示意 -->
  <rect x="100" y="315" width="700" height="60" rx="6" fill="#0f172a"/>
  <rect x="100" y="315" width="700" height="60" rx="6" fill="rgba(6,78,59,0.2)" stroke="#34d399" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="130" y="330" fill="#34d399" font-size="8" font-weight="600">调用链示例</text>
  <text x="130" y="350" fill="white" font-size="9" font-family="monospace">Header(token) → get_current_user(token) → require_admin(user) → route_handler(user)</text>
  <text x="130" y="365" fill="#94a3b8" font-size="8">每层依赖自动解析下层，路由只关心最终注入的对象</text>

  <!-- 箭头: 路由 -> 依赖 -->
  <line x1="450" y1="155" x2="450" y2="190" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>
  <text x="460" y="175" fill="#22d3ee" font-size="8">Depends</text>

  <!-- 基础服务层 -->
  <rect x="30" y="410" width="840" height="120" rx="12" fill="none" stroke="#a78bfa" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="50" y="435" fill="#a78bfa" font-size="10" font-weight="600">基础服务层 (Service Layer)</text>

  <!-- 服务盒子 -->
  <rect x="80" y="450" width="140" height="60" rx="6" fill="#0f172a"/>
  <rect x="80" y="450" width="140" height="60" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="150" y="473" fill="white" font-size="10" font-weight="600" text-anchor="middle">verify_token()</text>
  <text x="150" y="489" fill="#94a3b8" font-size="8" text-anchor="middle">JWT 解析</text>
  <text x="150" y="501" fill="#94a3b8" font-size="8" text-anchor="middle">签名验证</text>

  <rect x="260" y="450" width="140" height="60" rx="6" fill="#0f172a"/>
  <rect x="260" y="450" width="140" height="60" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="330" y="473" fill="white" font-size="10" font-weight="600" text-anchor="middle">数据库连接</text>
  <text x="330" y="489" fill="#94a3b8" font-size="8" text-anchor="middle">get_db()</text>
  <text x="330" y="501" fill="#94a3b8" font-size="8" text-anchor="middle">Session 管理</text>

  <rect x="440" y="450" width="140" height="60" rx="6" fill="#0f172a"/>
  <rect x="440" y="450" width="140" height="60" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="510" y="473" fill="white" font-size="10" font-weight="600" text-anchor="middle">Redis 缓存</text>
  <text x="510" y="489" fill="#94a3b8" font-size="8" text-anchor="middle">get_redis()</text>
  <text x="510" y="501" fill="#94a3b8" font-size="8" text-anchor="middle">连接池复用</text>

  <rect x="620" y="450" width="140" height="60" rx="6" fill="#0f172a"/>
  <rect x="620" y="450" width="140" height="60" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="690" y="473" fill="white" font-size="10" font-weight="600" text-anchor="middle">配置管理</text>
  <text x="690" y="489" fill="#94a3b8" font-size="8" text-anchor="middle">get_settings()</text>
  <text x="690" y="501" fill="#94a3b8" font-size="8" text-anchor="middle">环境变量加载</text>

  <!-- 箭头: 依赖 -> 基础服务 -->
  <line x1="450" y1="390" x2="450" y2="410" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-emerald)"/>
  <text x="460" y="405" fill="#34d399" font-size="8">调用</text>

  <!-- 底部提示 -->
  <text x="450" y="545" fill="#64748b" font-size="9" text-anchor="middle">依赖注入不是语法糖，是 FastAPI 架构的核心 — 路由保持纯粹，业务逻辑与横切关注点彻底解耦</text>
</svg>